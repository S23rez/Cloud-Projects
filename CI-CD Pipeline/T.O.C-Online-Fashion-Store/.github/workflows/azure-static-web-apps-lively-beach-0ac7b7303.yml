name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_BEACH_0AC7B7303 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "toc-store" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

        env:
            VITE_FIREBASE_API_KEY: "AIzaSyCeuwtbuo3SX2DJUrm61qMXWB9HqAAOlh4"
            VITE_FIREBASE_AUTH_DOMAIN: "t-o-c-ecommerce-website.firebaseapp.com"
            VITE_FIREBASE_PROJECT_ID: "t-o-c-ecommerce-website"
            VITE_FIREBASE_STORAGE_BUCKET: "t-o-c-ecommerce-website.firebasestorage.app"
            VITE_FIREBASE_MESSAGING_SENDER_ID: "668978433477"
            VITE_FIREBASE_APP_ID: "1:668978433477:web:935b26e90da0217fa88fac"
            VITE_EMAILJS_SERVICE_ID: "service_3uyvlmy"
            VITE_EMAILJS_TEMPLATE_ID: "template_8y165d4"
            VITE_EMAILJS_PUBLIC_KEY: "XAuqc3957vcqbLvcK"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_BEACH_0AC7B7303 }}
          action: "close"
